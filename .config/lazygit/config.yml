gui:
  language: "en"
quitOnTopLevelReturn: true
customCommands:
  - key: "O"
    context: "files"
    description: "Open selected file in tmux window 1 Neovim/shell, switch window, close popup"
    command: 'sh -c ''cmd=$(tmux display-message -p -t :1 "#{pane_current_command}"); if [ "$cmd" = "nvim" ] || [ "$cmd" = "vim" ]; then tmux send-keys -t :1 Escape ":e {{.SelectedFile.Name}}" Enter; else tmux send-keys -t :1 "nvim {{.SelectedFile.Name}}" Enter; fi; tmux select-window -t :1; tmux display-popup -C'''
    output: none
